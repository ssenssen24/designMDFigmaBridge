<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg2: var(--figma-color-text-secondary, #757575);
    --border: var(--figma-color-border, #e6e6e6);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --accent-fg: var(--figma-color-text-onbrand, #fff);
    --warn: var(--figma-color-bg-warning-tertiary, #fef6dd);
    --warn-fg: var(--figma-color-text-warning-tertiary, #5a3e00);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 11px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    color: var(--fg);
    background: var(--bg);
    padding: 12px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  h2 {
    font-size: 12px; font-weight: 600;
    margin: 0 0 4px;
  }
  p.hint {
    color: var(--fg2);
    margin: 0 0 10px;
  }
  details {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  details summary {
    padding: 6px 8px;
    cursor: pointer;
    font-weight: 500;
    list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; color: var(--fg2); }
  details[open] summary::before { content: "▾ "; }
  details > div { padding: 0 8px 8px; }

  input[type="url"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg2);
    color: var(--fg);
    font: inherit;
  }
  input[type="url"]:focus { outline: none; border-color: var(--accent); }

  .row {
    display: flex; gap: 6px; margin-top: 8px;
  }
  button {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--fg2);
    margin: 12px 0 4px;
    font-weight: 600;
  }

  .list {
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow-y: auto;
    background: var(--bg);
    flex-shrink: 0;
    max-height: 220px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--bg2); }
  .item input[type="checkbox"] { margin: 0; }
  .item .name { flex: 1; }
  .item .badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 8px;
    background: var(--bg3);
    color: var(--fg2);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .item .exists {
    font-size: 9px;
    color: var(--fg2);
  }
  .empty {
    padding: 16px;
    text-align: center;
    color: var(--fg2);
  }

  .toolbar {
    display: flex; gap: 6px; margin: 6px 0;
    font-size: 10px;
  }
  .toolbar button {
    flex: 0 0 auto;
    padding: 3px 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg2);
  }

  #log {
    margin-top: auto;
    padding: 8px;
    background: var(--bg2);
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    white-space: pre-wrap;
    height: 110px;
    overflow-y: auto;
    color: var(--fg2);
    flex-shrink: 0;
  }
  #log .line { margin: 0; }
</style>
</head>
<body>
  <h2>DESIGN.md → Figma Variables</h2>
  <p class="hint">Pick collections from your manifest. Brands first, then promotions.</p>

  <details id="settings">
    <summary>Manifest URL</summary>
    <div>
      <input id="manifestUrl" type="url"
        placeholder="https://raw.githubusercontent.com/.../master/payloads/manifest.json" />
      <div class="row">
        <button id="saveManifest" class="primary">Load manifest</button>
      </div>
    </div>
  </details>

  <div class="toolbar">
    <button id="selectAll">Select all</button>
    <button id="selectNone">Clear</button>
    <button id="selectBrands">Brands only</button>
    <button id="selectPromos">Promotions only</button>
  </div>

  <div id="list" class="list">
    <div class="empty">No manifest loaded yet. Open "Manifest URL" above.</div>
  </div>

  <div class="row">
    <button id="cancel">Close</button>
    <button id="import" class="primary" disabled>Import 0</button>
  </div>

  <div id="log"><p class="line">Ready.</p></div>

<script>
  const $ = (id) => document.getElementById(id);
  let entries = [];

  function append(msg) {
    const p = document.createElement("p");
    p.className = "line";
    p.textContent = msg;
    $("log").appendChild(p);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function render() {
    const list = $("list");
    if (!entries.length) {
      list.innerHTML = '<div class="empty">No collections in manifest.</div>';
      return;
    }
    list.innerHTML = "";
    for (const [i, e] of entries.entries()) {
      const item = document.createElement("label");
      item.className = "item";
      item.innerHTML = `
        <input type="checkbox" data-i="${i}" ${e._checked ? "checked" : ""} />
        <span class="name">${escapeHtml(e.name)}</span>
        ${e.existsLocally ? '<span class="exists">in file</span>' : ""}
        <span class="badge">${e.kind}</span>
      `;
      list.appendChild(item);
    }
    list.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener("change", (ev) => {
        const i = Number(ev.target.dataset.i);
        entries[i]._checked = ev.target.checked;
        updateImportBtn();
      });
    });
    updateImportBtn();
  }

  function updateImportBtn() {
    const n = entries.filter((e) => e._checked).length;
    const btn = $("import");
    btn.disabled = n === 0;
    btn.textContent = `Import ${n}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  function applyFilter(fn) {
    entries.forEach((e) => (e._checked = fn(e)));
    render();
  }

  // Manifest load
  $("saveManifest").addEventListener("click", () => {
    const url = $("manifestUrl").value.trim();
    if (!url) return append("⚠ Please enter a URL.");
    parent.postMessage({ pluginMessage: { type: "set-manifest", url } }, "*");
  });

  // Toolbar
  $("selectAll").addEventListener("click", () => applyFilter(() => true));
  $("selectNone").addEventListener("click", () => applyFilter(() => false));
  $("selectBrands").addEventListener("click", () =>
    applyFilter((e) => e.kind === "brand"));
  $("selectPromos").addEventListener("click", () =>
    applyFilter((e) => e.kind === "promotion"));

  // Import
  $("import").addEventListener("click", () => {
    const selected = entries.filter((e) => e._checked);
    if (!selected.length) return;
    $("import").disabled = true;
    $("log").innerHTML = "";
    parent.postMessage(
      { pluginMessage: { type: "import", entries: selected } },
      "*"
    );
  });

  $("cancel").addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "close" } }, "*");
  });

  window.addEventListener("message", (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "init") {
      $("manifestUrl").value = msg.manifestUrl || "";
      if (!msg.manifestUrl) $("settings").open = true;
    } else if (msg.type === "manifest-loaded") {
      entries = msg.entries.map((e) => ({ ...e, _checked: false }));
      append(`📋 Loaded ${entries.length} collection(s).`);
      render();
    } else if (msg.type === "log") {
      append(msg.message);
    } else if (msg.type === "done") {
      updateImportBtn();
    }
  });
</script>
</body>
</html>
