<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg2: var(--figma-color-text-secondary, #757575);
    --border: var(--figma-color-border, #e6e6e6);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --accent-fg: var(--figma-color-text-onbrand, #fff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font: 11px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    color: var(--fg);
    background: var(--bg);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  h2 { font-size: 12px; font-weight: 600; margin: 0; }

  details {
    border: 1px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
  }
  details summary {
    padding: 5px 8px;
    cursor: pointer;
    font-weight: 500;
    list-style: none;
    font-size: 10px;
    color: var(--fg2);
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  details > div { padding: 0 8px 8px; display: flex; gap: 4px; }
  details input[type="url"] {
    flex: 1; min-width: 0;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg2);
    color: var(--fg);
    font: inherit;
  }
  details input[type="url"]:focus { outline: none; border-color: var(--accent); }
  details button {
    padding: 4px 10px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }

  .toolbar {
    display: flex; gap: 4px;
    flex-shrink: 0;
  }
  .toolbar button {
    padding: 3px 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--fg2);
    font: inherit;
    cursor: pointer;
    font-size: 10px;
  }

  .list {
    flex: 1;
    min-height: 80px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow-y: auto;
    background: var(--bg);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--bg2); }
  .item input[type="checkbox"] { margin: 0; }
  .item .name { flex: 1; font-size: 11px; }
  .item .badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 6px;
    background: var(--bg3);
    color: var(--fg2);
    text-transform: uppercase;
  }
  .empty {
    padding: 14px 10px;
    text-align: center;
    color: var(--fg2);
    font-size: 10px;
  }

  .actions {
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .actions button {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .actions button.primary {
    background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  }
  .actions button:disabled { opacity: 0.5; cursor: not-allowed; }

  #log {
    height: 80px;
    padding: 6px 8px;
    background: var(--bg2);
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    white-space: pre-wrap;
    overflow-y: auto;
    color: var(--fg2);
    flex-shrink: 0;
  }
  #log .line { margin: 0 0 2px; }
</style>
</head>
<body>
  <h2>DESIGN.md → Figma Variables</h2>

  <details id="settings">
    <summary>Manifest URL</summary>
    <div>
      <input id="manifestUrl" type="url"
        placeholder="https://raw.githubusercontent.com/.../manifest.json" />
      <button id="saveManifest">Load</button>
    </div>
  </details>

  <div class="toolbar">
    <button id="selectAll">Select all</button>
    <button id="selectNone">Clear</button>
    <button id="selectBrands">Brands</button>
    <button id="selectPromos">Promos</button>
  </div>

  <div id="list" class="list">
    <div class="empty">Loading…</div>
  </div>

  <div class="actions">
    <button id="cancel">Close</button>
    <button id="import" class="primary" disabled>Import 0</button>
  </div>

  <div id="log"><p class="line">Ready.</p></div>

<script>
  const $ = (id) => document.getElementById(id);
  let entries = [];

  function append(msg) {
    const p = document.createElement("p");
    p.className = "line";
    p.textContent = msg;
    $("log").appendChild(p);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function render() {
    const list = $("list");
    if (!entries.length) {
      list.innerHTML = '<div class="empty">No collections in manifest.</div>';
      return;
    }
    list.innerHTML = "";
    for (const [i, e] of entries.entries()) {
      const item = document.createElement("label");
      item.className = "item";
      item.innerHTML = `
        <input type="checkbox" data-i="${i}" ${e._checked ? "checked" : ""} />
        <span class="name">${escapeHtml(e.name)}${e.existsLocally ? " ✓" : ""}</span>
        <span class="badge">${e.kind}</span>
      `;
      list.appendChild(item);
    }
    list.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener("change", (ev) => {
        const i = Number(ev.target.dataset.i);
        entries[i]._checked = ev.target.checked;
        updateImportBtn();
      });
    });
    updateImportBtn();
  }

  function updateImportBtn() {
    const n = entries.filter((e) => e._checked).length;
    const btn = $("import");
    btn.disabled = n === 0;
    btn.textContent = `Import ${n}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  function applyFilter(fn) {
    entries.forEach((e) => (e._checked = fn(e)));
    render();
  }

  $("saveManifest").addEventListener("click", () => {
    const url = $("manifestUrl").value.trim();
    if (!url) return append("⚠ Please enter a URL.");
    parent.postMessage({ pluginMessage: { type: "set-manifest", url } }, "*");
  });

  $("manifestUrl").addEventListener("keypress", (e) => {
    if (e.key === "Enter") $("saveManifest").click();
  });

  $("selectAll").addEventListener("click", () => applyFilter(() => true));
  $("selectNone").addEventListener("click", () => applyFilter(() => false));
  $("selectBrands").addEventListener("click", () =>
    applyFilter((e) => e.kind === "brand"));
  $("selectPromos").addEventListener("click", () =>
    applyFilter((e) => e.kind === "promotion"));

  $("import").addEventListener("click", () => {
    const selected = entries.filter((e) => e._checked);
    if (!selected.length) return;
    $("import").disabled = true;
    parent.postMessage(
      { pluginMessage: { type: "import", entries: selected } },
      "*"
    );
  });

  $("cancel").addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "close" } }, "*");
  });

  window.addEventListener("message", (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "init") {
      $("manifestUrl").value = msg.manifestUrl || "";
    } else if (msg.type === "open-settings") {
      $("settings").open = true;
    } else if (msg.type === "manifest-loaded") {
      entries = msg.entries.map((e) => ({ ...e, _checked: false }));
      render();
      $("settings").open = false; // auto-collapse on success
    } else if (msg.type === "log") {
      append(msg.message);
    } else if (msg.type === "done") {
      updateImportBtn();
    }
  });
</script>
</body>
</html>
